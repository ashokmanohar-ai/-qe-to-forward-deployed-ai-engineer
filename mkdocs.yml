site_name: QE to Forward Deployed AI Engineer
site_description: A practical 24-week transition path from Quality Engineering to Forward Deployed AI Engineering
repo_url: https://github.com/ashokmanohar-ai/-qe-to-forward-deployed-ai-engineer
repo_name: ashokmanohar-ai/qe-to-forward-deployed-ai-engineer
theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link
  palette:
    - scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
    - scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Getting started: getting-started.md
  - QE skill bridge: skill-bridge.md
  - Roadmap: roadmap.md
  - Learning stages:
      - 1. Foundation: stages/01-foundation.md
      - 2. Cloud and deployment: stages/02-cloud-deployment.md
      - 3. AI engineering: stages/03-ai-engineering.md
      - 4. Forward deployed engineering: stages/04-forward-deployed-engineering.md
      - 5. Advanced production AI: stages/05-advanced-production-ai.md
  - Labs: labs/index.md
  - Portfolio projects: projects/index.md
  - Customer scenarios: scenarios/customer-scenarios.md
  - Architecture: reference/architecture.md
  - Interview roadmap: interview/roadmap.md
  - Resources: resources.md

